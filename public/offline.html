<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Keyway - Offline</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <style>
    :root { color-scheme: light dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      background: #fafafa; color: #18181b; padding: 24px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #09090b; color: #fafafa; }
      .card { background: #18181b !important; border-color: #27272a !important; }
      p { color: #a1a1aa !important; }
    }
    .card {
      background: #fff; border: 1px solid #e4e4e7; border-radius: 16px;
      padding: 40px 32px; max-width: 420px; width: 100%; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.06);
    }
    .badge {
      width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 18px;
      background: #ecfdf5; display: flex; align-items: center; justify-content: center;
    }
    .badge svg { width: 34px; height: 34px; stroke: #059669; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p { color: #71717a; font-size: 14px; line-height: 1.55; margin-bottom: 22px; }
    button {
      background: #059669; color: #fff; border: 0; border-radius: 10px;
      padding: 11px 22px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:active { transform: scale(.98); }
    .hint { font-size: 12px; margin-top: 16px; color: #a1a1aa; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" stroke="currentColor">
        <path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v6l4 2"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Keyway needs a connection to show live orders, inventory and COD data. Cached pages you already opened still work.</p>
    <button onclick="location.reload()">Try again</button>
    <p class="hint">The app will reconnect automatically when your network returns.</p>
  </div>
  <script>
    // auto-reload once connectivity returns
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
